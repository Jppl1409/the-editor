appId: br.com.tfounders.theeditor
productName: The Editor
copyright: "The Editor — baseado no OpenReel Video (MIT) © Augustus Otu e colaboradores"
# Nomes sem versão: o link `releases/latest/download/<arquivo>` do site nunca muda.
artifactName: TheEditor-Setup.${ext}
asar: true
# The MCP stdio shim must be a real on-disk file so external clients (Claude
# Desktop / Cursor / Cline) can spawn it with `node`; unpack it from the asar.
asarUnpack:
  - dist/mcp-shim/**
directories:
  output: release
# The Editor: feed de atualização = release mais novo do GitHub. Com isto o build gera o
# latest.yml (versão + instalador) que o workflow anexa ao release e o app confere
# (apps/desktop/src/main/updater.ts usa a mesma URL).
publish:
  provider: generic
  url: https://github.com/Jppl1409/the-editor/releases/latest/download
files:
  - dist/**/*
  - "!**/*.map"
  - package.json
extraResources:
  - from: ../web/dist
    to: renderer
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
  - from: resources/rigging
    to: rigging
    filter:
      - "**/*"
  - from: resources/samples
    to: samples
    filter:
      - "**/*"
  - from: resources/aurora
    to: aurora
    filter:
      - "**/*"
  # The Editor: extensão do Claude Desktop (branding/build-mcpb.mjs) p/ "Conectar ao meu Claude".
  - from: resources/claude
    to: claude
    filter:
      - "**/*"
  - from: LICENSES
    to: LICENSES
    filter:
      - "**/*"
# The Editor: no Mac, assinatura ad-hoc (sem Apple Developer ID) depois do empacotamento.
# Sem nenhuma assinatura o macOS recente diz que o app "está danificado"; com a ad-hoc ele
# só pede "Abrir Mesmo Assim" em Ajustes do Sistema → Privacidade e Segurança na 1ª vez.
afterSign: ../../branding/mac-adhoc-sign.cjs
mac:
  category: public.app-category.video
  icon: build/icon.png
  # Um .dmg por arquitetura (Apple Silicon e Intel), cada um com o próprio nome.
  artifactName: TheEditor-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64]
  extendInfo:
    NSMicrophoneUsageDescription: O The Editor usa o microfone para gravar narrações no seu projeto.
    NSCameraUsageDescription: O The Editor usa a câmera para gravar clipes da webcam no seu projeto.
  gatekeeperAssess: false
  # The Editor: sem certificado da Apple por enquanto. O identity/notarize do OpenReel apontavam
  # para o Developer ID do autor original (Augustus Otu), que não é nosso. Para assinar e
  # notarizar com um Apple Developer ID próprio: trocar `identity: null` pelo nome do
  # certificado, voltar `hardenedRuntime: true` + entitlements + `notarize`, e tirar o afterSign.
  identity: null
  hardenedRuntime: false
win:
  icon: build/icon.ico
  executableName: TheEditor
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: The Editor
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  uninstallDisplayName: The Editor
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: AudioVideo
