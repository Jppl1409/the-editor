name: The Editor — instaladores (Mac + Windows + Linux)

# Gera os instaladores do The Editor e publica um GitHub Release novo (theeditor-v<versão>):
#   TheEditor-arm64.dmg     (Mac Apple Silicon)
#   TheEditor-x64.dmg       (Mac Intel)
#   TheEditor-Setup.exe     (Windows 10/11, 64 bits) + .blockmap
#   TheEditor.AppImage      (Linux 64 bits, qualquer distro)
#   latest.yml / latest-linux.yml (o app confere aqui se há versão nova — botão "Verificar atualizações")
# Sem certificados: Mac com assinatura ad-hoc (branding/mac-adhoc-sign.cjs), Windows sem assinatura.
#
# Rodar: aba Actions → "The Editor — instaladores" → Run workflow. A versão sobe sozinha
# (1.0.1 → 1.0.2); para escolher, preencha o campo "versao".
# Links fixos para o site (sempre o release mais novo, nomes sem versão):
#   https://github.com/<conta>/<repo>/releases/latest/download/TheEditor-Setup.exe
#
# Os workflows herdados do OpenReel (ci, release, perf-gate…) disparam em `main` e em tags `v*`;
# aqui o branch é `the-editor` e as tags são `theeditor-v*`, então eles não rodam.
# Repositório: https://github.com/Jppl1409/the-editor

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão (ex.: 1.2.0). Em branco = sobe a última (1.0.1 → 1.0.2)"
        type: string
        default: ""
      publicar:
        description: "Publicar no GitHub Release (desmarque para só gerar e baixar pelos artifacts)"
        type: boolean
        default: true

concurrency:
  group: the-editor-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  versao:
    name: Definir versão
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      PEDIDA: ${{ inputs.versao }}
    steps:
      - id: v
        run: |
          set -euo pipefail
          if [ -n "$PEDIDA" ]; then
            version="${PEDIDA#v}"
          else
            last=$(gh release list -R "$GITHUB_REPOSITORY" --limit 50 --json tagName --jq '[.[].tagName | select(startswith("theeditor-v")) | ltrimstr("theeditor-v")] | sort_by(split(".") | map(tonumber? // 0)) | last // ""')
            if [ -z "$last" ]; then version="1.0.0"; else
              IFS=. read -r a b c <<< "$last"; version="$a.$b.$((c + 1))"; fi
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Versão inválida: $version"; exit 1; }
          echo "Versão: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.os }})
    needs: versao
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Dependências
        run: pnpm install --frozen-lockfile

      - name: Versão ${{ needs.versao.outputs.version }}
        shell: bash
        run: |
          node -e "const f='apps/desktop/package.json';const p=JSON.parse(require('fs').readFileSync(f,'utf8'));p.version='${{ needs.versao.outputs.version }}';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          node -p "require('./apps/desktop/package.json').version"

      - name: WebAssembly do núcleo
        run: pnpm build:wasm

      - name: FFmpeg embutido
        run: pnpm --filter @openreel/desktop fetch:ffmpeg

      - name: Interface (renderer) em modo desktop
        run: pnpm --filter @openreel/web build
        env:
          OPENREEL_DESKTOP: "1"
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Processo principal do Electron
        run: pnpm --filter @openreel/desktop build:main

      - name: Extensão do Claude Desktop (The Editor.mcpb)
        run: node branding/build-mcpb.mjs

      - name: Instaladores do Mac (.dmg arm64 + x64)
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --mac --publish never

      - name: Conferir assinatura ad-hoc do .app
        if: runner.os == 'macOS'
        working-directory: apps/desktop
        run: |
          for app in release/mac*/"The Editor.app"; do
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier|Format"
          done
          ls -la release/*.dmg

      - name: Instalador do Windows (.exe)
        if: runner.os == 'Windows'
        working-directory: apps/desktop
        shell: bash
        run: |
          unset CSC_LINK CSC_KEY_PASSWORD
          pnpm exec electron-builder --win nsis --x64 --publish never
          ls -la release/*.exe

      - name: Instalador do Linux (.AppImage)
        if: runner.os == 'Linux'
        working-directory: apps/desktop
        run: |
          pnpm exec electron-builder --linux AppImage --x64 --publish never
          ls -la release/*.AppImage release/latest-linux.yml

      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.blockmap
            apps/desktop/release/latest.yml
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publicar no GitHub Release
    needs: [versao, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && inputs.publicar }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Criar release e anexar instaladores
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/*.dmg out/*.exe out/*.blockmap out/*.AppImage out/latest.yml out/latest-linux.yml)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::Nenhum instalador foi gerado."; exit 1; fi
          version="${{ needs.versao.outputs.version }}"
          [ -f out/latest.yml ] || { echo "::error::Faltou o latest.yml (sem ele o app não acha a atualização)."; exit 1; }
          tag="theeditor-v${version}"
          notes=$'The Editor '"${version}"$'.\n\n'
          notes+=$'**Mac:** baixe o `arm64` (Apple Silicon, M1 em diante) ou o `x64` (Intel). Na 1ª vez, abra o app, depois vá em Ajustes do Sistema → Privacidade e Segurança e clique em "Abrir Mesmo Assim".\n\n'
          notes+=$'**Windows:** se aparecer "O Windows protegeu o computador", clique em "Mais informações" → "Executar assim mesmo".

'
          notes+=$'**Linux:** baixe o `TheEditor.AppImage`, marque "Permitir executar como programa" (ou `chmod +x TheEditor.AppImage`) e abra.'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "The Editor ${version}" --notes "$notes" --latest
          fi
          gh release view "$tag" --json url,assets --jq '.url, (.assets[] | .name + "  " + .url)'
